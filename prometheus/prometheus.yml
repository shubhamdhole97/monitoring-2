global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # ----------------------------
  # Prometheus self
  # ----------------------------
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  # ----------------------------
  # Node Exporter (ALL SERVERS)
  # ----------------------------
  - job_name: "node"
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          hostname: "monitoring-server"

      - targets:
          - "34.16.120.24:9100"
        labels:
          hostname: "web1"

      - targets:
          - "34.42.59.231:9100"
        labels:
          hostname: "web2"

    # Save IP:PORT into separate label
    relabel_configs:
      - source_labels: [__address__]
        target_label: ip
